<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#dfe8f4" />
    <meta name="description" content="Skye 的私人主页与搜索入口" />
    <title>Skye · Private Space</title>
    <style>
      :root {
        color-scheme: light;
        --text: #182333;
        --muted: #5d6b7c;
        --line: rgba(255, 255, 255, 0.72);
        --glass: rgba(255, 255, 255, 0.46);
        --glass-strong: rgba(255, 255, 255, 0.68);
        --shadow: 0 24px 70px rgba(62, 83, 112, 0.18), 0 3px 12px rgba(62, 83, 112, 0.08);
        --accent: #5379d8;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-width: 280px;
        min-height: 100%;
      }
      body {
        min-height: 100svh;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.86), transparent 28%),
          radial-gradient(circle at 88% 18%, rgba(180, 211, 255, 0.52), transparent 30%),
          radial-gradient(circle at 50% 110%, rgba(190, 214, 239, 0.66), transparent 42%),
          linear-gradient(135deg, #eef4fb 0%, #dfe8f4 48%, #e8edf5 100%);
        font:
          14px Arial,
          Helvetica,
          sans-serif;
      }
      body::before,
      body::after {
        position: fixed;
        z-index: -1;
        width: 34vw;
        height: 34vw;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        content: '';
        filter: blur(5px);
        pointer-events: none;
      }
      body::before {
        top: 16%;
        left: -12%;
      }
      body::after {
        right: -10%;
        bottom: 8%;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .skip-link {
        position: absolute;
        top: 10px;
        left: 50%;
        padding: 10px 16px;
        color: #fff;
        background: #202124;
        transform: translate(-50%, -150%);
        transition: transform 0.15s ease;
      }
      .skip-link:focus {
        transform: translate(-50%, 0);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        width: min(100% - 40px, 1280px);
        min-height: 54px;
        margin: 18px auto 0;
        padding: 6px 4px 6px 2px;
        color: var(--muted);
        font-size: 13px;
      }
      .topbar-brand {
        color: var(--text);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 22px;
        font-style: italic;
        font-weight: 600;
        letter-spacing: -0.06em;
        text-shadow: 0 4px 14px rgba(73, 96, 135, 0.16);
      }
      .topbar-nav {
        display: flex;
        align-items: center;
        gap: 26px;
      }
      .topbar-nav a {
        position: relative;
        padding: 8px 0;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      .topbar-nav a::after {
        position: absolute;
        right: 0;
        bottom: 2px;
        left: 0;
        height: 2px;
        border-radius: 2px;
        background: var(--accent);
        content: '';
        opacity: 0;
        transform: scaleX(0.35);
        transition: 0.2s ease;
      }
      .topbar-nav a:hover,
      .topbar-nav a:focus-visible {
        color: var(--text);
      }
      .topbar-nav a:hover::after,
      .topbar-nav a:focus-visible::after {
        opacity: 0.8;
        transform: scaleX(1);
      }
      main {
        display: flex;
        min-height: calc(100svh - 178px);
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: clamp(55px, 11vh, 120px) 20px 58px;
      }
      .hero-kicker {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .brand {
        margin: 0 0 25px;
        color: var(--text);
        font-size: clamp(4.4rem, 10vw, 7.2rem);
        font-weight: 600;
        letter-spacing: -0.12em;
        line-height: 0.86;
        text-shadow: 0 8px 24px rgba(73, 96, 135, 0.16);
        user-select: none;
      }
      .brand span:nth-child(1) {
        color: #5278d8;
      }
      .brand span:nth-child(2) {
        color: #6079b5;
      }
      .brand span:nth-child(3) {
        color: #7799db;
      }
      .brand span:nth-child(4) {
        color: #405b9e;
      }
      .search-form {
        width: min(100%, 620px);
      }
      .engine-picker {
        display: flex;
        min-inline-size: 0;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 15px;
        padding: 0;
        border: 0;
      }
      .engine-option {
        position: relative;
        display: inline-flex;
        align-items: center;
      }
      .engine-option input {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .engine-option span {
        min-height: 34px;
        padding: 9px 12px;
        border: 0;
        border-radius: 12px;
        color: var(--muted);
        background: transparent;
        font-size: 12px;
        transition: 0.18s ease;
      }
      .engine-option:hover span {
        color: var(--text);
        background: rgba(255, 255, 255, 0.3);
      }
      .engine-option input:checked + span {
        color: var(--text);
        background: rgba(255, 255, 255, 0.62);
        box-shadow: 0 6px 18px rgba(62, 83, 112, 0.1);
      }
      .engine-option input:focus-visible + span {
        outline: 3px solid rgba(83, 121, 216, 0.4);
        outline-offset: 2px;
      }
      .search-box {
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 60px;
        padding: 0 19px;
        border: 0;
        border-radius: 30px;
        background: var(--glass-strong);
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.72),
          0 18px 50px rgba(62, 83, 112, 0.15);
        backdrop-filter: blur(26px) saturate(145%);
        -webkit-backdrop-filter: blur(26px) saturate(145%);
        transition:
          box-shadow 0.18s ease,
          transform 0.18s ease;
      }
      .search-box:hover {
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.82),
          0 22px 58px rgba(62, 83, 112, 0.19);
        transform: translateY(-1px);
      }
      .search-box:focus-within {
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.92),
          0 22px 58px rgba(62, 83, 112, 0.2),
          0 0 0 1px rgba(83, 121, 216, 0.28);
        transform: translateY(-1px);
      }
      .search-icon {
        flex: 0 0 auto;
        width: 20px;
        margin-right: 10px;
        color: var(--accent);
        font-size: 20px;
        line-height: 1;
        text-align: center;
      }
      .search-context {
        margin-right: 10px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .search-input {
        min-width: 0;
        flex: 1;
        height: 42px;
        border: 0;
        outline: 0;
        color: var(--text);
        background: transparent;
        font-size: 16px;
      }
      .clear-button {
        display: none;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        color: var(--muted);
        background: transparent;
        font-size: 22px;
      }
      .search-input:not(:placeholder-shown) + .clear-button {
        display: block;
      }
      .clear-button:hover {
        color: var(--text);
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 30px;
      }
      .action-button {
        min-height: 40px;
        padding: 0 19px;
        border: 0;
        border-radius: 20px;
        color: var(--text);
        background: var(--glass);
        box-shadow:
          0 8px 20px rgba(62, 83, 112, 0.1),
          inset 0 1px 1px rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        font-size: 13px;
      }
      .action-primary {
        color: #fff;
        background: linear-gradient(135deg, #6689e1, #4f6ec6);
      }
      .action-primary:hover,
      .action-primary:focus-visible {
        color: #fff;
        background: linear-gradient(135deg, #7395e9, #5a78d2);
      }
      .action-button:hover,
      .action-button:focus-visible {
        border-color: rgba(255, 255, 255, 0.98);
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 12px 28px rgba(62, 83, 112, 0.16);
        color: var(--text);
        transform: translateY(-1px);
      }
      .hint {
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .engine-caption {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.04em;
        text-align: center;
      }
      kbd {
        padding: 3px 7px;
        border: 0;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.46);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.6);
        font-size: 11px;
      }
      footer {
        display: flex;
        width: min(100% - 32px, 1280px);
        min-height: 58px;
        align-items: center;
        justify-content: space-between;
        margin: 0 auto 16px;
        padding: 0 20px;
        border: 0;
        border-radius: 22px;
        color: var(--muted);
        background: var(--glass);
        box-shadow: var(--shadow);
        backdrop-filter: blur(24px) saturate(140%);
        -webkit-backdrop-filter: blur(24px) saturate(140%);
        font-size: 13px;
      }
      .footer-links {
        display: flex;
        gap: 24px;
      }
      footer a:hover {
        text-decoration: underline;
      }
      :focus-visible {
        outline: 3px solid rgba(66, 133, 244, 0.45);
        outline-offset: 2px;
      }
      @media (max-width: 600px) {
        .topbar {
          width: calc(100% - 20px);
          margin-top: 10px;
          padding: 8px 10px 8px 14px;
        }
        .topbar-brand {
          font-size: 12px;
        }
        .topbar-nav {
          gap: 10px;
        }
        .topbar-nav a:first-child {
          display: none;
        }
        main {
          min-height: calc(100svh - 145px);
          padding-top: 80px;
        }
        .brand {
          margin-bottom: 30px;
          letter-spacing: -0.1em;
        }
        .actions {
          margin-top: 24px;
        }
        footer {
          width: calc(100% - 20px);
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
          padding: 18px 20px;
        }
        .footer-links {
          gap: 18px;
        }
      }
      @media (prefers-contrast: more) {
        .topbar,
        .search-box,
        .action-button,
        footer {
          box-shadow: 0 0 0 2px currentColor;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#search">跳到搜索框</a>
    <header class="topbar" aria-label="顶部导航">
      <span class="topbar-brand">skye</span>
      <nav class="topbar-nav" aria-label="私人主页导航">
        <a href="/">主页</a>
        <a href="/search/">工具</a>
      </nav>
    </header>
    <main id="search" tabindex="-1">
      <p class="hero-kicker">private search space</p>
      <h1 class="brand" aria-label="Skye"><span>S</span><span>k</span><span>y</span><span>e</span></h1>
      <form
        class="search-form"
        action="https://www.google.com/search"
        method="get"
        target="_blank"
        rel="noopener"
        role="search"
      >
        <fieldset class="engine-picker" aria-label="选择搜索引擎">
          <legend class="sr-only">选择搜索引擎</legend>
          <label class="engine-option"
            ><input type="radio" name="engine" value="https://www.google.com/search" data-engine checked /><span
              >Google</span
            ></label
          >
          <label class="engine-option"
            ><input type="radio" name="engine" value="https://www.bing.com/search" data-engine /><span
              >Bing</span
            ></label
          >
          <label class="engine-option"
            ><input type="radio" name="engine" value="https://duckduckgo.com/" data-engine /><span
              >DuckDuckGo</span
            ></label
          >
          <label class="engine-option"
            ><input type="radio" name="engine" value="https://search.brave.com/search" data-engine /><span
              >Brave</span
            ></label
          >
          <label class="engine-option"
            ><input type="radio" name="engine" value="https://github.com/search" data-engine data-param="q" /><span
              >GitHub</span
            ></label
          >
        </fieldset>
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <label class="sr-only" for="query">搜索</label>
          <span class="search-context" aria-hidden="true">web</span>
          <input
            class="search-input"
            id="query"
            name="q"
            type="search"
            placeholder="在 Skye 中搜索"
            autocomplete="on"
            required
          />
          <button class="clear-button" type="button" aria-label="清除搜索" title="清除搜索">×</button>
        </div>
        <div class="actions">
          <button class="action-button action-primary" type="submit" data-search-submit>开始搜索</button>
          <button class="action-button" type="submit" name="btnI" value="1">随便看看</button>
        </div>
        <p class="engine-caption">选择一个入口，查询将直接发送至对应服务</p>
      </form>
      <p class="hint"><kbd>/</kbd> 快速聚焦搜索框 · <kbd>Esc</kbd> 清除内容</p>
    </main>
    <footer>
      <span>Skye Search</span>
      <nav class="footer-links" aria-label="页脚导航">
        <a href="/">返回主页</a>
        <a href="/profile/">关于 Skye</a>
        <a href="mailto:wwhooo@icloud.com">联系</a>
      </nav>
    </footer>
    <script>
      const input = document.querySelector('#query');
      const form = document.querySelector('.search-form');
      const clear = document.querySelector('.clear-button');
      const submit = form.querySelector('[data-search-submit]');
      const engines = [...document.querySelectorAll('[data-engine]')];
      const engineState = { action: form.action, param: 'q', label: 'Google' };
      const syncEngine = (engine) => {
        engineState.action = engine.value;
        engineState.param = engine.dataset.param ?? 'q';
        engineState.label = engine.nextElementSibling.textContent;
        form.action = engineState.action;
        submit.textContent = `使用 ${engineState.label}`;
        input.name = engineState.param;
      };
      engines.forEach((engine) => engine.addEventListener('change', () => syncEngine(engine)));
      form.addEventListener('submit', (event) => {
        if (!input.value.trim()) {
          event.preventDefault();
          input.focus();
        }
      });
      clear.addEventListener('click', () => {
        input.value = '';
        input.focus();
      });
      document.addEventListener('keydown', (event) => {
        const target = event.target;
        const isEditing =
          target instanceof HTMLElement &&
          (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName));
        if (event.key === '/' && !isEditing && !event.ctrlKey && !event.metaKey && !event.altKey) {
          event.preventDefault();
          input.focus();
        }
        if (
          event.key === 'Escape' &&
          (document.activeElement === input || document.activeElement?.matches('[data-engine]'))
        ) {
          input.value = '';
          input.focus();
        }
      });
    </script>
  </body>
</html>
