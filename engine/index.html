    <script>
      // Progressive-enhancement handshake, run before first paint.
      //
      // scripts/build-routes.mjs replaces the placeholder above with the real
      // prerendered page, so a visitor without JavaScript still gets the full
      // homepage — but the entry gate would be an unopenable overlay, hence
      // `.no-js` hides it via the stylesheet in <head>.
      //
      // `inert` on the gated content is applied here rather than baked into the
      // static markup, for the same reason: no-JS visitors must not be locked
      // out of content they can actually read.
      (function () {
        var root = document.documentElement;
        var entered = false;
        try {
          entered = sessionStorage.getItem('wwhooo-entered') === '1';
          var theme = localStorage.getItem('wwhooo-theme');
          if (theme === 'light' || theme === 'dark' || theme === 'system') root.dataset.theme = theme;
        } catch (e) {
          /* private mode */
        }
        root.classList.remove('no-js');
        if (entered) root.classList.add('entered');
        var content = document.getElementById('home-content');
        if (content && !entered) {
          content.setAttribute('inert', '');
          content.setAttribute('aria-hidden', 'true');
        }
      })();
    </script>
