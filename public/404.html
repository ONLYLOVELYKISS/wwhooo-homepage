<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e1e9e4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101513" media="(prefers-color-scheme: dark)" />
    <title>页面不存在 — Linn</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500&display=swap"
    />
    <style>
      /* Served by Nginx (`error_page 404 /404.html`) with a real 404 status.
         Every route is a real static file after the build, so the old GitHub
         Pages `/?/path` redirect dance is gone: no flash, no extra hop. */
      :root {
        --ink: #141c1b;
        --paper: #e1e9e4;
        --muted: #57655f;
        --accent: #9a3f2d;
        --line: rgba(20, 28, 27, 0.22);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 10vh max(20px, 8vw);
        background: var(--paper);
        color: var(--ink);
        font:
          400 14px/1.8 'Plus Jakarta Sans',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: block;
      }
      .kicker {
        display: inline-flex;
        align-self: flex-start;
        padding: 4px 12px;
        border-radius: 20px;
        background: rgba(191, 89, 69, 0.12);
        border: 1px solid rgba(191, 89, 69, 0.25);
        color: var(--accent);
        font:
          500 10px 'DM Mono',
          ui-monospace,
          monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: clamp(20px, 4vh, 48px) 0 clamp(16px, 3vh, 32px);
        font:
          italic clamp(3.4rem, 11vw, 9rem)/0.84 'Instrument Serif',
          Georgia,
          serif;
        font-weight: 400;
        letter-spacing: -0.06em;
      }
      h1 i {
        color: var(--accent);
      }
      p {
        max-width: 460px;
        margin: 0 0 clamp(28px, 5vh, 56px);
        color: var(--muted);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 22px;
      }
      nav a {
        color: var(--ink);
        text-decoration: none;
        padding-bottom: 3px;
        border-bottom: 1px solid var(--line);
        font:
          500 11px 'DM Mono',
          ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition:
          color 0.25s,
          border-color 0.25s;
      }
      nav a:hover,
      nav a:focus-visible {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      footer {
        margin-top: clamp(40px, 8vh, 90px);
        color: var(--muted);
        font:
          400 10px 'DM Mono',
          ui-monospace,
          monospace;
        letter-spacing: 0.08em;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --ink: #e7efe9;
          --paper: #101513;
          --muted: #aab8b0;
          --accent: #e9a08b;
          --line: rgba(255, 255, 255, 0.22);
        }
        .kicker {
          background: rgba(232, 161, 138, 0.12);
          border-color: rgba(232, 161, 138, 0.28);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="kicker">404 / Not found</span>
      <h1>这个地址<br /><i>没有内容。</i></h1>
      <p>
        也许链接已经改变，或者它从来没有存在过。<br />
        The link may have changed, or it never existed at all.
      </p>
      <nav>
        <a href="/">Home</a>
        <a href="/engine/">Engine</a>
        <a href="/profile/">Profile</a>
        <a href="/works/">Works</a>
      </nav>
    </main>
    <footer>WW / LINN — wwhooo.com</footer>
  </body>
</html>
