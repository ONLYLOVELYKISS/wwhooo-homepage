name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A burst of pushes must not race: force-orphan deploys that overlap can publish
# an older build after a newer one.
concurrency:
  group: publish-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint, format check, then build + generate per-route HTML/sitemap + run
      # the suite. The suite enforces image-weight budgets, per-route canonicals
      # and the no-JS contract, so a regression fails the deploy instead of
      # shipping.
      - name: Lint, format check, test and build
        run: npm run check

      - name: Keep the built site for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist-failed-build
          path: dist
          if-no-files-found: ignore

      - name: Publish deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          # Keep history on the deploy branch: it costs ~250 KB per release and
          # it is what makes `git reset --hard HEAD~1` a usable rollback.
          # (force_orphan: true rewrote the branch every time, leaving the
          # server with nothing to roll back to.)
          force_orphan: false
          commit_message: 'deploy: ${{ github.sha }}'
