# wwhooo.com — nginx config for the `static-site` container
#
# This is what production actually runs. Layout on the host:
#
#   /opt/static-site/nginx.conf  ->  /etc/nginx/conf.d/default.conf   (bind, ro)
#   /opt/static-site/site        ->  /usr/share/nginx/html            (bind, ro)
#   container:                    nginx:alpine, 127.0.0.1:8080 -> 80
#   in front:                     cloudflared tunnel container
#
# Apply a change (no restart needed, the mount is read-only but nginx reloads
# from disk):
#
#   sudo docker exec static-site nginx -t && sudo docker exec static-site nginx -s reload
#
# This is a conf.d *snippet* (server block only): the official nginx image's
# /etc/nginx/nginx.conf already supplies `http {}`, mime types and `gzip on`.
# On a bare-metal Debian box use bare-metal.conf instead — the two are not
# interchangeable.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Every route is a real file (engine/index.html, profile/index.html, ...), so
    # /engine/ resolves through the ordinary `index` lookup, and a path that
    # matches nothing can return a genuine 404 instead of a 200 soft-404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Styled 404 page. `internal` also stops /404.html from being fetched
    # directly — without it the file is publicly readable at its own URL.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Never serve dotfiles. The deploy branch ships a .nojekyll marker, which
    # `try_files` would otherwise happily hand out.
    location ~ /\. {
        deny all;
    }

    # Content-hashed build output. The filename changes whenever the bytes do,
    # so a year of caching is safe. Note this alone is not enough: Cloudflare's
    # "Browser Cache TTL" defaults to 4 hours on Free plans and rewrites the
    # header unless it is set to "Respect Existing Headers" in the dashboard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /icon.svg {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Derived icons are not content-hashed, so keep them short-lived.
    location ~ ^/(icon-192|icon-512|apple-touch-icon)\.png$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # The shell must be revalidated. A stale index.html would reference asset
    # hashes that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ ^/(manifest\.webmanifest|robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Browsers still probe /favicon.ico; keep it out of the error log.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Cloudflare compresses at the edge, so this mostly matters for direct
    # origin requests and for the tunnel's cache misses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;
}
