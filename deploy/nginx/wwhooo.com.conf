# wwhooo.com — Nginx site configuration
#
# Install:
#   sudo cp deploy/nginx/wwhooo.com.conf /etc/nginx/sites-available/wwhooo.com
#   sudo ln -sf /etc/nginx/sites-available/wwhooo.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Why there is no SPA fallback (`try_files ... /index.html`) here:
#   scripts/build-routes.mjs emits a real index.html for every route, so
#   /engine/ resolves to engine/index.html through the normal `index` lookup.
#   That means an unknown path can return a genuine 404 status instead of a
#   200 "soft 404", and no client-side redirect dance is needed.

server {
    listen 80;
    listen [::]:80;
    server_name wwhooo.com www.wwhooo.com;

    root /opt/static-site/site;
    index index.html;
    charset utf-8;
    autoindex off;

    # Deliberately NOT redirecting http -> https here. With Cloudflare Tunnel
    # in front, an nginx-side redirect fights Cloudflare's own "Always Use
    # HTTPS" setting and can loop. Turn on "Always Use HTTPS" in the Cloudflare
    # dashboard instead; if Nginx terminates TLS itself, use the :443 block at
    # the bottom of this file and move the redirect there.

    # Every route is a real file. Unknown paths get a real 404.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Content-hashed build output: safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Photographs and icons.
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /icon.svg {
        expires 30d;
        add_header Cache-Control "public";
    }

    # The shell must be revalidated, or a stale index.html can reference asset
    # hashes that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ ^/(manifest\.webmanifest|robots\.txt|sitemap\.xml)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Browsers still probe /favicon.ico; keep it out of the error log.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # Uncomment when cloudflared runs on this host, so logs show the visitor IP
    # rather than 127.0.0.1.
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header CF-Connecting-IP;
}

