# wwhooo.com — nginx config for a bare-metal Debian host
#
# Use this only if nginx runs directly on the host (apt-installed) instead of in
# the `static-site` container. Production currently uses the container, so
# wwhooo.com.conf is the file that matters. The two are NOT interchangeable:
# this one is a complete server block for sites-available, the container one is
# a conf.d snippet.
#
#   sudo cp deploy/nginx/bare-metal.conf /etc/nginx/sites-available/wwhooo.com
#   sudo ln -sf /etc/nginx/sites-available/wwhooo.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name wwhooo.com www.wwhooo.com;

    root /opt/static-site/site;
    index index.html;

    charset utf-8;
    server_tokens off;
    autoindex off;

    # Deliberately NOT redirecting http -> https here. With Cloudflare Tunnel in
    # front, a host-side redirect fights Cloudflare's "Always Use HTTPS" setting
    # and can loop. Enable "Always Use HTTPS" in the Cloudflare dashboard; if
    # nginx terminates TLS itself, add an ssl server block and redirect there.

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~ /\. {
        deny all;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /icon.svg {
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~ ^/(icon-192|icon-512|apple-touch-icon)\.png$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ ^/(manifest\.webmanifest|robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # Uncomment when cloudflared runs on this host, so logs show the visitor IP
    # rather than 127.0.0.1.
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header CF-Connecting-IP;
}
